<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zero Budget</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Budget"><meta name="theme-color" content="#2f6f4f">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf9f7;--card:#fff;--tx:#1d1d1b;--mu:#7a7871;--ln:#e8e5df;--ac:#2f6f4f;--bad:#b3402f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222220;--tx:#f1efe9;--mu:#9a978f;--ln:#34332f;--ac:#6fc59a;--bad:#e5806e}}
:root[data-theme="dark"]{--bg:#171716;--card:#222220;--tx:#f1efe9;--mu:#9a978f;--ln:#34332f;--ac:#6fc59a;--bad:#e5806e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 16px 40px}

h1{font-size:13px;color:var(--mu);font-weight:600;margin:0 0 8px;letter-spacing:.04em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:34px;font-weight:700}.ok{color:var(--ac)}.bad{color:var(--bad)}.mu{color:var(--mu);font-size:13px}
input,select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);min-width:0;width:100%}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer;width:auto;padding:10px 14px}button.g{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}button.d{background:var(--bad)}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--ln);cursor:pointer}.r:first-of-type{border-top:0}
.bar{height:6px;background:var(--ln);border-radius:4px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}.bar i.b{background:var(--bad)}.bar i.w{background:#d9a520}
.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.day{padding:8px 0;border-radius:8px;background:var(--bg);border:1px solid var(--ln);cursor:pointer;min-height:48px;font-size:14px}.day.s{border-color:var(--ac);background:var(--card)}.day.t{font-weight:700;color:var(--ac)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin:0 1px}.dot.p{background:none;border:1px solid currentColor}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.mini span{font-size:9px;text-align:center;border-radius:3px;line-height:15px;cursor:pointer}
.mod{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.mod>div{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.mod label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}.row{display:flex;gap:8px;margin-top:14px}.row button{flex:1}
</style></head><body>
<nav id="nav"></nav><main id="v"></main><div id="m"></div>
<script>
const K="zb2";let S={cats:[{id:1,n:"Rent",t:0},{id:2,n:"Groceries",t:0}],tx:[],accts:[{id:1,n:"Checking",b:0}],debts:[],rec:[],extra:0,seq:10};
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
S.rec.forEach(r=>{r.fr=r.fr||"monthly";if(!r.sd)r.sd=new Date().toISOString().slice(0,8)+String(Math.min(r.day||1,28)).padStart(2,"0")});
const $=i=>document.getElementById(i),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const TD=iso(new Date()),MO=TD.slice(0,7),m=n=>(n<0?"-":"")+"$"+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sg=t=>t=="Income"?1:-1,nm=(l,id)=>(l.find(x=>x.id==id)||{}).n||"";
let tab="home",cm=new Date(),sel=TD,del=0,pm=MO,ps=null,txm=MO,cv="m";
let ver=0,ready=false,tok=null,me="",by="",stat="Connecting…",st,busy=false;
try{tok=localStorage.getItem("zbt");me=localStorage.getItem("zbn")||""}catch(e){}
const api=(mt,b)=>fetch("/api/data",{method:mt,headers:{Authorization:"Bearer "+(tok||""),"content-type":"application/json"},body:b?JSON.stringify(b):undefined});
const fix=()=>{S.gst=S.gst??5;S.qst=S.qst??9.975;S.rec=S.rec||[];S.rec.forEach(r=>{r.fr=r.fr||"monthly"})};
const lc=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const push=()=>{if(!ready)return;clearTimeout(st);stat="Saving…";busy=true;st=setTimeout(async()=>{try{const r=await api("POST",{base:ver,json:JSON.stringify(S)});
 if(r.status==409){const c=await r.json();if(c.json){S=JSON.parse(c.json);fix();lc()}ver=c.ver;stat="Someone else changed the budget, so the latest was loaded. Please redo your last change."}
 else if(r.ok){ver=(await r.json()).ver;stat="Saved ✓ (shared)"}else if(r.status==401){ready=false;login("Session expired — please sign in again")}else stat="Save failed — try again"}catch(e){stat="Offline — not saved to the shared budget"}busy=false;draw()},500)};
const save=()=>{lc();push();draw()};
const op=l=>[[0,"—"],...l.map(x=>[x.id,x.n])];
const FR=[["weekly","Weekly"],["biweekly","Every 2 weeks"],["monthly","Monthly"],["quarterly","Every 3 months"],["yearly","Yearly"]],FRL=Object.fromEntries(FR);
const TY=[["Expense","Expense"],["Income","Income"],["Debt","Debt payment"]],TXT=[...TY,["Transfer","Transfer"]];
const isOut=x=>x.ty=="Expense"||x.ty=="Debt";S.gst=S.gst??5;S.qst=S.qst??9.975;
const parts=x=>x.sp?x.sp.map(p=>({c:p.c,a:p.a*(p.t?1+(S.gst+S.qst)/100:1)})):[{c:x.c,a:x.a}];
const spentCat=(l,id)=>l.filter(isOut).reduce((s,x)=>s+parts(x).filter(p=>p.c==id).reduce((u,p)=>u+p.a,0),0);
const E={
 tx:{a:"tx",f:()=>[{k:"ty",l:"Type",t:"s",o:TXT},{k:"a",l:"Amount",t:"number"},{k:"d",l:"Date",t:"date"},{k:"n",l:"Note"},{k:"c",l:"Category",t:"s",o:op(S.cats),i:1},{k:"ac",l:"Account (from, for transfers)",t:"s",o:op(S.accts),i:1},{k:"ac2",l:"To account (transfers only)",t:"s",o:op(S.accts),i:1},{k:"db",l:"Debt (if debt payment)",t:"s",o:op(S.debts),i:1}]},
 cat:{a:"cats",f:()=>[{k:"n",l:"Name"},{k:"t",l:"Monthly target $",t:"number"}]},
 ac:{a:"accts",f:()=>[{k:"n",l:"Account name"},{k:"b",l:"Starting balance $",t:"number"}]},
 db:{a:"debts",f:()=>[{k:"n",l:"Debt name"},{k:"bal",l:"Starting balance $",t:"number"},{k:"apr",l:"APR %",t:"number"},{k:"min",l:"Minimum payment $",t:"number"}]},
 rc:{a:"rec",f:()=>[{k:"n",l:"Name"},{k:"ty",l:"Type",t:"s",o:TY},{k:"a",l:"Amount",t:"number"},{k:"fr",l:"Frequency",t:"s",o:FR},{k:"sd",l:"First / next due date",t:"date"},{k:"c",l:"Category",t:"s",o:op(S.cats),i:1},{k:"ac",l:"Account",t:"s",o:op(S.accts),i:1},{k:"db",l:"Debt",t:"s",o:op(S.debts),i:1}]}
};
function open(key,id,pre){const e=E[key],L=S[e.a],it=id?L.find(x=>x.id==id):{...pre};del=0;
 $("m").innerHTML=`<div class="mod"><div><b>${id?"Edit":"Add"}</b>`+e.f().map(f=>{const v=it[f.k]??"";return `<label>${f.l}</label>`+(f.t=="s"?`<select data-k="${f.k}">${f.o.map(o=>`<option value="${o[0]}"${o[0]==v?" selected":""}>${esc(o[1])}</option>`).join("")}</select>`:`<input data-k="${f.k}" type="${f.t||"text"}"${f.t=="number"?' step="any" inputmode="decimal"':""} value="${esc(v)}">`)}).join("")+
 `<div class="row"><button class="g" data-x="c">Cancel</button>${id?'<button class="d" data-x="d">Delete</button>':""}<button data-x="s">Save</button></div></div></div>`;
 $("m").onclick=ev=>{const x=ev.target.dataset.x;if(ev.target.classList.contains("mod")||x=="c"){$("m").innerHTML="";return}
  if(x=="d"){if(!del){del=1;ev.target.textContent="Tap again to delete";return}S[e.a]=L.filter(y=>y.id!=id);$("m").innerHTML="";save()}
  if(x=="s"){const o=id?it:{id:S.seq++};e.f().forEach(f=>{const v=$$(`[data-k="${f.k}"]`,$("m"))[0].value;o[f.k]=f.t=="number"?parseFloat(v)||0:f.i?Number(v)||0:v});
   if(key=="tx"&&!(o.a>0))return;if(key=="tx"&&o.ty=="Transfer"&&(!o.ac||!o.ac2||o.ac==o.ac2))return;if(key=="rc"&&!o.sd)return;if(!id)L.push(o);$("m").innerHTML="";save()}}}
const bal=a=>a.b+S.tx.reduce((s,x)=>x.ty=="Transfer"?s+(x.ac2==a.id?x.a:0)-(x.ac==a.id?x.a:0):x.ac==a.id?s+sg(x.ty)*x.a:s,0);
const cur=d=>Math.max(0,d.bal-S.tx.filter(x=>x.ty=="Debt"&&x.db==d.id).reduce((s,x)=>s+x.a,0));
const occ=(r,ds)=>{if(!r.sd||ds<r.sd)return false;const[y,mo,d]=ds.split("-").map(Number),[sy,sm,sd]=r.sd.split("-").map(Number),dim=new Date(y,mo,0).getDate(),df=Math.round((Date.UTC(y,mo-1,d)-Date.UTC(sy,sm-1,sd))/864e5),md=(y-sy)*12+mo-sm,f=r.fr||"monthly";
 if(f=="weekly")return df%7==0;if(f=="biweekly")return df%14==0;const dd=Math.min(sd,dim)==d;
 return f=="monthly"?dd:f=="quarterly"?dd&&md%3==0:dd&&md%12==0};
const recOn=ds=>S.rec.filter(r=>occ(r,ds));
const addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
function fc(n){let b=S.accts.reduce((s,a)=>s+bal(a),0),out=[];for(let i=1;i<=n;i++){const ds=addD(i);recOn(ds).forEach(r=>{b+=sg(r.ty)*r.a;out.push({...r,d:ds,b})})}return out}
function snow(){const ds=S.debts.map(d=>({id:d.id,n:d.n,b:cur(d),apr:d.apr,min:d.min})).filter(d=>d.b>0).sort((a,b)=>a.b-b.b),pay=ds.reduce((s,d)=>s+d.min,0)+(S.extra||0);
 let mo=0,int=0,ord=[];while(ds.some(d=>d.b>0.005)&&mo<600){mo++;ds.forEach(d=>{if(d.b>0){const i=d.b*d.apr/1200;d.b+=i;int+=i}});let av=pay;
  ds.forEach(d=>{if(d.b>0){const p=Math.min(d.min,d.b);d.b-=p;av-=p}});ds.forEach(d=>{if(av>0&&d.b>0){const p=Math.min(av,d.b);d.b-=p;av-=p}});
  ds.forEach(d=>{if(d.b<=0.005&&!d.done){d.done=mo;ord.push({n:d.n,m:mo})}})}
 return{ord,mo,int,ok:!ds.some(d=>d.b>0.005),pay}}
const mx=n=>{const d=new Date();d.setMonth(d.getMonth()+n);return d.toLocaleString(undefined,{month:"short",year:"numeric"})};
const row=(key,x,l,r)=>`<div class="r" data-e="${key}" data-id="${x.id}"><span>${l}</span><span>${r}</span></div>`;
const txr=x=>x.ty=="Transfer"?row("tx",x,`${esc(x.n||"Transfer")} <span class="mu">${x.d.slice(5)} ${esc(nm(S.accts,x.ac))} → ${esc(nm(S.accts,x.ac2))}</span>`,`<b>⇄ ${m(x.a)}</b>`):row("tx",x,`${esc(x.n||x.ty)} <span class="mu">${x.d.slice(5)} ${x.sp?"split · "+x.sp.length+" items":esc(nm(S.cats,x.c)||nm(S.debts,x.db))}</span>`,`<b class="${x.ty=="Income"?"ok":""}">${x.ty=="Income"?"+":"−"}${m(x.a)}</b>`);
const inMo=ym=>S.tx.filter(x=>x.d.slice(0,7)==ym);

const mo6=()=>[...Array(6)].map((_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);return iso(d).slice(0,7)});
function trendC(){const D=mo6().map(y=>{const t=inMo(y);return{y,i:t.filter(x=>x.ty=="Income").reduce((s,x)=>s+x.a,0),o:t.filter(isOut).reduce((s,x)=>s+x.a,0)}}),X=Math.max(1,...D.flatMap(d=>[d.i,d.o]));
 return `<svg viewBox="0 0 320 145" width="100%">`+D.map((d,k)=>{const x=k*53+8,hi=d.i/X*100,ho=d.o/X*100,l=new Date(d.y+"-01T12:00").toLocaleString(undefined,{month:"short"});return `<rect x="${x}" y="${110-hi}" width="19" height="${hi}" rx="3" style="fill:var(--ac)"/><rect x="${x+21}" y="${110-ho}" width="19" height="${ho}" rx="3" style="fill:var(--bad)"/><text x="${x+20}" y="130" text-anchor="middle" font-size="11" style="fill:var(--mu)">${l}</text>`}).join("")+`</svg><div class="mu"><span class="ok">■</span> income &nbsp; <span class="bad">■</span> spending (max ${m(X)})</div>`}
function accC(){const X=Math.max(1,...S.accts.map(a=>Math.abs(bal(a))));return S.accts.map(a=>{const b=bal(a);return `<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between"><span>${esc(a.n)}</span><b class="${b<0?"bad":""}">${m(b)}</b></div><div class="bar"><i class="${b<0?"b":""}" style="width:${Math.abs(b)/X*100}%"></i></div></div>`}).join("")||'<div class="mu">No accounts</div>'}
function watchC(){const tm=inMo(MO),R=S.cats.map(c=>({n:c.n,t:c.t,s:spentCat(tm,c.id)})).filter(o=>o.s>0||o.t>0).map(o=>({...o,p:o.t?o.s/o.t:o.s>0?9:0})).sort((a,b)=>b.p-a.p).slice(0,8);
 return R.map(o=>`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between"><span>${esc(o.n)}</span><span class="${o.p>1?"bad":"mu"}">${m(o.s)} / ${o.t?m(o.t):"no budget"}</span></div><div class="bar"><i class="${o.p>1?"b":o.p>.85?"w":""}" style="width:${Math.min(100,o.p*100)}%"></i></div></div>`).join("")+(R.length?'<div class="mu">Red = over budget · amber = over 85%</div>':'<div class="mu">Set targets and log spending to see this</div>')}
const shM=(ym,n)=>{const[y,mo]=ym.split("-").map(Number);return iso(new Date(y,mo-1+n,1)).slice(0,7)};
const mlabel=ym=>new Date(ym+"-01T12:00").toLocaleString(undefined,{month:"long",year:"numeric"});
const COL=["#2f6f4f","#d9a520","#b3402f","#3a6ea5","#8e5ea2","#e07b39","#4f9d9d","#c0568a","#6b8e23","#a0522d","#5b7db1","#7a7871"];
function pieC(){const tm=inMo(pm);let P=S.cats.map((c,i)=>({n:c.n,v:spentCat(tm,c.id),col:COL[i%COL.length]})).filter(p=>p.v>0.004);
 const tot=tm.filter(isOut).reduce((s,x)=>s+x.a,0),oth=tot-P.reduce((s,p)=>s+p.v,0);if(oth>0.01)P.push({n:"Uncategorized",v:oth,col:"#9a978f"});
 P.sort((a,b)=>b.v-a.v);const TT=P.reduce((s,p)=>s+p.v,0),sl=ps!=null&&P[ps]?ps:null;
 const hd=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><button class="g" data-pm="-1">‹</button><b>${mlabel(pm)}</b><button class="g" data-pm="1">›</button></div>`;
 if(!TT)return hd+'<div class="mu">No spending logged this month</div>';
 let a0=-Math.PI/2;const R=82,r=50,C=95,pt=(rad,a)=>(C+rad*Math.cos(a)).toFixed(2)+" "+(C+rad*Math.sin(a)).toFixed(2);
 const arcs=P.map((p,i)=>{const a1=a0+Math.min(p.v/TT,.99999)*2*Math.PI,lg=a1-a0>Math.PI?1:0,d=`M${pt(R,a0)} A${R} ${R} 0 ${lg} 1 ${pt(R,a1)} L${pt(r,a1)} A${r} ${r} 0 ${lg} 0 ${pt(r,a0)}Z`,mid=(a0+a1)/2,off=i==sl?6:0;a0=a1;
  return `<path d="${d}" data-ps="${i}" transform="translate(${(off*Math.cos(mid)).toFixed(2)} ${(off*Math.sin(mid)).toFixed(2)})" style="fill:${p.col};cursor:pointer;opacity:${sl==null||i==sl?1:.45}"/>`}).join("");
 const c=sl!=null?P[sl]:null;
 return hd+`<svg viewBox="0 0 190 190" width="100%" style="max-width:260px;display:block;margin:0 auto"><g>${arcs}</g><text x="95" y="90" text-anchor="middle" font-size="12" style="fill:var(--mu)">${c?esc(c.n):"Total"}</text><text x="95" y="108" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--tx)">${m(c?c.v:TT)}</text>${c?`<text x="95" y="123" text-anchor="middle" font-size="11" style="fill:var(--mu)">${Math.round(c.v/TT*100)}%</text>`:""}</svg>`
 +P.map((p,i)=>`<div class="r" data-ps="${i}" style="${i==sl?"font-weight:700":""}"><span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${p.col};margin-right:6px"></span>${esc(p.n)}</span><span>${m(p.v)} <span class="mu">${Math.round(p.v/TT*100)}%</span></span></div>`).join("")}
function txv(){const tm=inMo(txm),inc=tm.filter(x=>x.ty=="Income").reduce((s,x)=>s+x.a,0),out=tm.filter(isOut).reduce((s,x)=>s+x.a,0),trf=tm.filter(x=>x.ty=="Transfer").reduce((s,x)=>s+x.a,0);
 return `<div class="card"><h1>Add</h1><button data-add="tx">+ Transaction</button> <button class="g" data-add="sp">+ Split receipt</button> <button class="g" data-add="tx" data-ty="Transfer">⇄ Transfer</button> <button class="g" data-sync="4">Import from Claude</button></div>
 <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><button class="g" data-tm="-1">‹</button><b>${mlabel(txm)}</b><button class="g" data-tm="1">›</button></div><div class="mu" style="margin:8px 0">Income ${m(inc)} · Spent ${m(out)} · Transfers ${m(trf)}</div>${tm.slice().sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).map(txr).join("")||'<div class="mu">Nothing this month</div>'}</div>`}
function importTx(txt){let o;try{o=JSON.parse(txt)}catch(e){return"That isn't valid data."}
 const L=Array.isArray(o)?o:o&&o.entries;if(!Array.isArray(L))return"No entries found.";
 const f=(l,n)=>(l.find(x=>String(x.n).trim().toLowerCase()==String(n||"").trim().toLowerCase())||{}).id||0;let add=0,skip=0,unc=0;
 L.forEach(e=>{const ty=["Income","Expense","Debt","Transfer"].find(t=>t.toLowerCase()==String(e.type||"Expense").toLowerCase())||"Expense",a=Math.abs(parseFloat(e.amount)||0),d=/^\d{4}-\d{2}-\d{2}$/.test(e.date)?e.date:TD,n=String(e.note||"").slice(0,80);if(!(a>0))return;
  if(S.tx.some(x=>x.d==d&&Math.abs(x.a-a)<.005&&(x.n||"")==n&&x.ty==ty)){skip++;return}
  const t={id:S.seq++,ty,a,d,n,c:f(S.cats,e.category),ac:f(S.accts,e.account),ac2:f(S.accts,e.to_account),db:f(S.debts,e.debt)};
  if(Array.isArray(e.items)&&e.items.length&&ty=="Expense"){t.sp=e.items.map(i=>({c:f(S.cats,i.category),a:Math.abs(parseFloat(i.amount)||0),t:i.taxable?1:0})).filter(i=>i.a>0);t.c=0}
  if(ty=="Expense"&&!t.c&&!t.sp)unc++;S.tx.push(t);add++});

function imp(){$("m").innerHTML=`<div class="mod"><div><b>Import from Claude</b><div class="mu" style="margin:6px 0">Upload a receipt photo or statement PDF in your Claude chat and ask for it in app format. Paste the result here. Entries already in the app are skipped.</div><textarea id="js" rows="9" style="width:100%;font:12px monospace;padding:8px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)"></textarea><div class="row"><button class="g" data-x="c">Close</button><button data-x="im">Import</button></div><div class="mu" id="sm"></div></div></div>`;

  return `<div class="card">${seg}${nav}</div><div class="card"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${h}</div><div class="mu" style="margin-top:8px">Green = income · red = spending · outline = upcoming recurring. Tap a month or a day to open it.</div></div>`}
 const y=cm.getFullYear(),mo=cm.getMonth(),f=new Date(y,mo,1).getDay(),dim=new Date(y,mo+1,0).getDate();let h="";
 for(let i=0;i<f;i++)h+="<div></div>";for(let d=1;d<=dim;d++){const ds=iso(new Date(y,mo,d)),a=S.tx.filter(x=>x.d==ds),p=ds>TD?recOn(ds):[];
  h+=`<div class="day ${ds==sel?"s":""} ${ds==TD?"t":""}" data-day="${ds}">${d}<br>${a.some(x=>x.ty=="Income")?'<span class="dot ok" style="background:var(--ac)"></span>':""}${a.some(x=>isOut(x))?'<span class="dot" style="background:var(--bad)"></span>':""}${p.length?'<span class="dot p"></span>':""}</div>`}
 const a=S.tx.filter(x=>x.d==sel),p=sel>TD?recOn(sel):[];
 return `<div class="card">${seg}${nav}<div class="g7" style="margin-top:8px">${"SMTWTFS".split("").map(x=>`<div class="mu">${x}</div>`).join("")}${h}</div><div class="mu" style="margin-top:8px">● logged · ○ upcoming recurring</div></div>
 <div class="card"><h1>${sel}</h1>${a.map(txr).join("")}${p.map(upc).join("")}${a.length+p.length?"":'<div class="mu">Nothing on this day</div>'}<br><button data-add="tx" data-date="${sel}">+ Add on this day</button></div>`}

 const g=$("gst");if(g){g.onchange=()=>{S.gst=parseFloat(g.value)||0;save()};$("qst").onchange=()=>{S.qst=parseFloat($("qst").value)||0;save()}}

 if(d.ps!=null){ps=ps==+d.ps?null:+d.ps;draw()}else if(d.pm){pm=shM(pm,+d.pm);ps=null;draw()}else if(d.tm){txm=shM(txm,+d.tm);draw()}else if(d.cv){cv=d.cv;draw()}

function split(id,pre){const t=id?S.tx.find(x=>x.id==id):{d:TD,ac:0,n:"",sp:[{c:0,a:0,t:0}],...pre};let L=t.sp.map(p=>({...p})),TOT=id?t.a:0;del=0;
